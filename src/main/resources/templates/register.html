<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BloodHelp - Donor Registration</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #fff5f5;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: white;
            max-width: 450px;
            margin: 30px auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 15px #00000020;
        }

        h1 {
            color: #c62828;
            text-align: center;
        }

        p {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 25px;
            background: #c62828;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #a51d1d;
        }

        .error {
            color: red;
            font-weight: bold;
        }

        .success {
            color: green;
            font-weight: bold;
        }

        a {
            color: #c62828;
            text-decoration: none;
        }

        .links {
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>❤️ BloodHelp</h1>
    <p>Become a Blood Donor</p>

    <!-- Error message -->
    <p class="error"
       th:if="${error}"
       th:text="${error}">
    </p>

    <!-- Success message -->
    <p class="success"
       th:if="${param.success}">
        Donor registered successfully!
    </p>

    <!-- Donor registration form -->
    <form th:action="@{/register}" th:object="${donor}" method="post">

        <label>Full Name</label>
        <input type="text"
               th:field="*{name}"
               placeholder="Enter your full name"
               required>

        <label>Age</label>
        <input type="number"
               th:field="*{age}"
               min="18"
               max="65"
               placeholder="Enter your age"
               required>

        <label>Blood Group</label>
        <select th:field="*{bloodGroup}" required>
            <option value="">Select Blood Group</option>
            <option value="A+">A+</option>
            <option value="A-">A-</option>
            <option value="B+">B+</option>
            <option value="B-">B-</option>
            <option value="AB+">AB+</option>
            <option value="AB-">AB-</option>
            <option value="O+">O+</option>
            <option value="O-">O-</option>
        </select>

        <label>Phone Number</label>
        <input type="tel"
               th:field="*{phone}"
               placeholder="Enter 10-digit phone number"
               pattern="[0-9]{10}"
               maxlength="10"
               required>

        <label>City</label>
        <input type="text"
               th:field="*{city}"
               placeholder="Enter your city"
               required>

        <button type="submit">Register as Donor</button>

    </form>

    <div class="links">
        <p><a href="/">Back to Home</a></p>
        <p><a href="/search">Search Blood Donors</a></p>
    </div>

</div>

</body>
</html>
