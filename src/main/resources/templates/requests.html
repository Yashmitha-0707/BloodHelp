<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blood Requests - BloodHelp</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #fff0f0;
            padding: 25px;
        }

        h1 {
            text-align: center;
            color: #c62828;
        }

        table {
            width: 100%;
            background: white;
            border-collapse: collapse;
            margin-top: 25px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center;
        }

        th {
            background: #c62828;
            color: white;
        }

        tr:nth-child(even) {
            background: #fff5f5;
        }

        .edit {
            color: blue;
            font-weight: bold;
        }

        .delete-button {
            background: #c62828;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
        }

        .back {
            text-align: center;
            margin-top: 25px;
        }
    </style>
</head>

<body>

<h1>🩸 Patient Blood Requests</h1>

<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Patient</th>
            <th>Blood Group</th>
            <th>Units</th>
            <th>Hospital</th>
            <th>City</th>
<th>Contact</th>
<th>Action</th>
        </tr>
    </thead>

    <tbody>
        <tr th:each="request : ${requests}">
            <td th:text="${request.id}"></td>
            <td th:text="${request.patientName}"></td>
            <td th:text="${request.bloodGroup}"></td>
            <td th:text="${request.units}"></td>
            <td th:text="${request.hospitalName}"></td>
            <td th:text="${request.city}"></td>
<td>
    <a th:href="'tel:' + ${request.contactNumber}">
        Call
    </a>

    |

    <a th:href="'https://wa.me/91' + ${request.contactNumber}"
       target="_blank">
        WhatsApp
    </a>
</td>
            <td>
                <a class="edit"
                   th:href="@{/requests/edit/{id}(id=${request.id})}">
                    Edit
                </a>

                <form th:action="@{/requests/delete/{id}(id=${request.id})}"
                      method="post"
                      style="display:inline;">

                    <button type="submit"
                            class="delete-button"
                            onclick="return confirm('Are you sure you want to delete this request?')">
                        Delete
                    </button>

                </form>
            </td>
        </tr>

        <tr th:if="${#lists.isEmpty(requests)}">
            <td colspan="8">No blood requests available.</td>
        </tr>
    </tbody>
</table>

<div class="back">
    <a th:href="@{/request}">Submit Another Request</a>
    |
    <a th:href="@{/admin}">Admin Dashboard</a>
</div>

</body>
</html>
