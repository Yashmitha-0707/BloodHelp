<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | BloodHelp</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff0f0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 90%;
            max-width: 400px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #ddd;
        }

        h1 {
            text-align: center;
            color: #c62828;
        }

        p {
            text-align: center;
            color: #666;
        }

        label {
            display: block;
            margin-top: 18px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        .password-container {
            position: relative;
        }

        .password-container input {
            padding-right: 65px;
        }

        .toggle-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #c62828;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            padding: 5px;
            margin: 0;
            width: auto;
        }

        .login-button {
            width: 100%;
            padding: 13px;
            margin-top: 25px;
            background: #c62828;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        .error {
            color: red;
            text-align: center;
        }

        .success {
            color: green;
            text-align: center;
        }

        .signup {
            margin-top: 20px;
            text-align: center;
        }

        a {
            color: #c62828;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h1>🩸 BloodHelp</h1>
    <p>Login to your account</p>

    <p class="error" th:if="${param.error}">
        Invalid username or password.
    </p>

    <p class="success" th:if="${param.logout}">
        You have logged out successfully.
    </p>

    <form th:action="@{/login}" method="post">

        <label>Username</label>
        <input type="text"
               name="username"
               placeholder="Enter your username"
               autocomplete="username"
               required>

        <label>Password</label>

        <div class="password-container">
            <input type="password"
                   id="password"
                   name="password"
                   placeholder="Enter your password"
                   autocomplete="current-password"
                   required>

            <button type="button"
                    class="toggle-password"
                    id="togglePassword"
                    onclick="togglePasswordVisibility()">
                Show
            </button>
        </div>

        <button type="submit" class="login-button">
            Sign In
        </button>

    </form>

    <div class="signup">
        Don't have an account?
        <a th:href="@{/signup}">Create Account</a>
    </div>

</div>

<script>
    function togglePasswordVisibility() {

        const passwordInput = document.getElementById("password");
        const toggleButton = document.getElementById("togglePassword");

        if (passwordInput.type === "password") {
            passwordInput.type = "text";
            toggleButton.textContent = "Hide";
        } else {
            passwordInput.type = "password";
            toggleButton.textContent = "Show";
        }
    }
</script>

</body>
</html>
