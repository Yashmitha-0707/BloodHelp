<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Blood Request</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #fff5f5;
            margin: 0;
            padding: 30px 15px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 12px #00000020;
        }

        h1 {
            text-align: center;
            color: #c62828;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 11px;
            margin-top: 7px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 25px;
            background: #c62828;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #c62828;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>❤️ Edit Blood Request</h1>

    <form th:action="@{/requests/edit/{id}(id=${bloodRequest.id})}"
          th:object="${bloodRequest}"
          method="post">

        <label>Patient Name</label>
        <input type="text" th:field="*{patientName}" required>

        <label>Blood Group</label>
        <select th:field="*{bloodGroup}" required>
            <option value="A+">A+</option>
            <option value="A-">A-</option>
            <option value="B+">B+</option>
            <option value="B-">B-</option>
            <option value="O+">O+</option>
            <option value="O-">O-</option>
            <option value="AB+">AB+</option>
            <option value="AB-">AB-</option>
        </select>

        <label>Units Required</label>
        <input type="number" th:field="*{units}"
               min="1" max="20" required>

        <label>Hospital Name</label>
        <input type="text" th:field="*{hospitalName}" required>

        <label>City</label>
        <input type="text" th:field="*{city}" required>

        <label>Contact Number</label>
        <input type="tel" th:field="*{contactNumber}"
               pattern="[0-9]{10}" maxlength="10"
               minlength="10" required>

        <button type="submit">Update Request</button>

    </form>

    <a class="back" href="/requests">← Back to Blood Requests</a>

</div>

</body>
</html>
