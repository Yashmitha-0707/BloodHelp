
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registered Donors - BloodHelp</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #fff0f0;
            padding: 25px;
        }

        h1 {
            text-align: center;
            color: #c62828;
        }

        table {
            width: 100%;
            max-width: 1000px;
            margin: 30px auto;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 14px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #c62828;
            color: white;
        }

        tr:nth-child(even) {
            background: #fff5f5;
        }

        a {
            color: #c62828;
            text-decoration: none;
            font-weight: bold;
        }

        .action {
            display: inline-block;
            padding: 8px 12px;
            margin: 3px;
            border-radius: 5px;
            color: white;
        }

        .edit {
            background: #c62828;
        }

        .delete {
            background: #333;
            border: none;
            cursor: pointer;
            padding: 9px 12px;
            border-radius: 5px;
            color: white;
        }

        .register-link {
            display: block;
            width: fit-content;
            margin: 20px auto;
        }
    </style>
</head>

<body>

<h1>❤️ Registered Blood Donors</h1>

<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Age</th>
            <th>Blood Group</th>
            <th>City</th>
            <th>Actions</th>
        </tr>
    </thead>

    <tbody>
        <tr th:each="donor : ${donors}">
            <td th:text="${donor.id}"></td>
            <td th:text="${donor.name}"></td>
            <td th:text="${donor.age}"></td>
            <td th:text="${donor.bloodGroup}"></td>
            <td th:text="${donor.city}"></td>

            <td>
                <div th:if="${username != null and (username == donor.registeredByUsername or (donor.registeredBy != null and username == donor.registeredBy.username))}">

                    <a class="action edit"
                       th:href="@{/donors/edit/{id}(id=${donor.id})}">
                        Edit
                    </a>

                    <form th:action="@{/donors/delete/{id}(id=${donor.id})}"
                          method="post"
                          style="display:inline;"
                          onsubmit="return confirm('Are you sure you want to delete this donor registration?');">

                        <button type="submit" class="delete">
                            Delete
                        </button>
                    </form>

                </div>

                <span th:unless="${username != null and (username == donor.registeredByUsername or (donor.registeredBy != null and username == donor.registeredBy.username))}">
                    -
                </span>
            </td>
        </tr>
    </tbody>
</table>

<a class="register-link" href="/register">
    + Register Another Donor
</a>

</body>
</html>
