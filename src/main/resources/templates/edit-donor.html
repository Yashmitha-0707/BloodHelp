<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Donor Details | BloodHelp</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #fff5f5;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: 35px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 12px #ddd;
        }

        h2 {
            text-align: center;
            color: #c62828;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 11px;
            margin-top: 7px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 12px;
            background: #c62828;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .error {
            color: red;
            text-align: center;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #c62828;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Edit My Donor Details</h2>

    <p class="error" th:if="${error}" th:text="${error}"></p>

    <form th:action="@{/donors/edit/{id}(id=${donor.id})}"
          th:object="${donor}"
          method="post">

        <label>Name</label>
        <input type="text" th:field="*{name}" required>

        <label>Age</label>
        <input type="number" th:field="*{age}"
               min="18" max="65" required>

        <label>Blood Group</label>
        <select th:field="*{bloodGroup}" required>
            <option value="">Select Blood Group</option>
            <option value="A+">A+</option>
            <option value="A-">A-</option>
            <option value="B+">B+</option>
            <option value="B-">B-</option>
            <option value="AB+">AB+</option>
            <option value="AB-">AB-</option>
            <option value="O+">O+</option>
            <option value="O-">O-</option>
        </select>

        <label>Phone Number</label>
        <input type="tel"
               th:field="*{phone}"
               pattern="[0-9]{10}"
               maxlength="10"
               minlength="10"
               required>

        <label>City</label>
        <input type="text" th:field="*{city}" required>

        <button type="submit">Save Changes</button>

    </form>

    <a class="back" th:href="@{/dashboard}">
        Back to Dashboard
    </a>

</div>

</body>
</html>
