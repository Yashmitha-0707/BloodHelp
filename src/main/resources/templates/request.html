<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blood Request - BloodHelp</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #fff0f0;
            padding: 25px;
        }

        .container {
            max-width: 450px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #c62828;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 25px;
            background: #c62828;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .success {
            color: green;
            text-align: center;
            font-weight: bold;
        }

        .error {
            color: red;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🩸 Request Blood</h1>

    <p class="success" th:if="${param.success}">
        Blood request submitted successfully!
    </p>

    <form th:action="@{/request}" th:object="${bloodRequest}" method="post">

        <p class="error" th:if="${error}" th:text="${error}"></p>

        <label>Patient Name</label>
        <input type="text" th:field="*{patientName}" required>

        <label>Blood Group Required</label>
        <select th:field="*{bloodGroup}" required>
            <option value="">Select Blood Group</option>
            <option value="A+">A+</option>
            <option value="A-">A-</option>
            <option value="B+">B+</option>
            <option value="B-">B-</option>
            <option value="AB+">AB+</option>
            <option value="AB-">AB-</option>
            <option value="O+">O+</option>
            <option value="O-">O-</option>
        </select>

        <label>Units Required</label>
        <input type="number" th:field="*{units}" min="1" max="20" required>

        <label>Hospital Name</label>
        <input type="text" th:field="*{hospitalName}" required>

        <label>City</label>
        <input type="text" th:field="*{city}" required>

        <label>Contact Number</label>
        <input type="tel"
               th:field="*{contactNumber}"
               pattern="[0-9]{10}"
               maxlength="10"
               required>

        <button type="submit">Submit Blood Request</button>

    </form>

    <p style="text-align:center;">
        <a th:href="@{/}">Back to Home</a>
    </p>

</div>

</body>
</html>
